<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dropshipping Cost Calculator 2026 | Free Store on 100shop</title>
<meta name="description" content="Compare Shopify's monthly fees against 100shop's free storefront. Enter your orders and apps — see exactly how much you save every year.">
<link rel="canonical" href="https://get100shop.com/">
<meta name="robots" content="index,follow">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif}
body{background:#0f172a;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px}
.card{background:#fff;border-radius:18px;max-width:470px;width:100%;padding:26px;box-shadow:0 18px 50px rgba(0,0,0,.3)}
.card h1{font-size:21px;color:#111827;margin-bottom:4px}
.card .sub{font-size:13px;color:#6b7280;margin-bottom:16px}
label{display:block;font-size:12px;font-weight:600;color:#374151;margin:14px 0 4px}
input[type=number]{width:100%;padding:11px 13px;border:1.5px solid #d1d5db;border-radius:10px;font-size:15px}
input[type=number]:focus{outline:none;border-color:#7f5bf5}
input[type=range]{width:100%;accent-color:#7f5bf5;margin-top:6px}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:14px}
.row label{margin:0;font-size:12px;font-weight:600;color:#374151}
.switch{position:relative;display:inline-block;width:46px;height:24px}
.switch input{opacity:0;width:0;height:0}
.sl{position:absolute;cursor:pointer;top:0;left:0;right:0;bottom:0;background:#cbd5e1;border-radius:24px;transition:.2s}
.sl:before{position:absolute;content:"";height:18px;width:18px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.2s}
input:checked+.sl{background:#7f5bf5}
input:checked+.sl:before{transform:translateX(22px)}
.result{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
.stat{background:#f4f0ff;border-radius:12px;padding:14px;text-align:center}
.stat .v{font-size:22px;font-weight:800;color:#7f5bf5}
.stat .l{font-size:12px;color:#6b7280;margin-top:2px}
.save{background:#ecfdf5}.save .v{color:#059669}
.cta{display:block;text-align:center;margin-top:18px;background:linear-gradient(90deg,#7f5bf5,#3b82f6);color:#fff;font-weight:700;font-size:15px;padding:13px;border-radius:12px;text-decoration:none}
.cta:hover{opacity:.92}
.note{font-size:11px;color:#9ca3af;text-align:center;margin-top:10px}
</style>
</head>
<body>
<div class="card">
  <h1>Store Cost Savings Calculator</h1>
  <p class="sub">Paid platforms vs 100shop's free storefront — see your yearly savings</p>

  <label>Monthly orders (approx)</label>
  <input id="orders" type="number" value="100" min="0">
  <label>Average order value (USD)</label>
  <input id="aov" type="number" value="45" min="0">
  <label>Shopify apps you pay for: <b id="appVal">2</b></label>
  <input id="apps" type="range" min="0" max="6" value="2">
  <div class="row">
    <label>Buy a premium theme (one-time $300)</label>
    <label class="switch"><input id="theme" type="checkbox"><span class="sl"></span></label>
  </div>

  <div class="result">
    <div class="stat"><div class="v" id="month">$0.00</div><div class="l">Paid platform / month</div></div>
    <div class="stat save"><div class="v" id="year">$0.00</div><div class="l">You save / year</div></div>
  </div>

  <a class="cta" href="https://get100shop.com/">Keep It All — Start FREE at 100shop →</a>
  <p class="note">Typical plan $39/mo + $29/app + 2.9% transaction fee. 100shop: $0/mo, no app or transaction fees.</p>
</div>
<script>
function calc(){
 const orders=parseFloat(document.getElementById('orders').value)||0;
 const aov=parseFloat(document.getElementById('aov').value)||0;
 const apps=parseInt(document.getElementById('apps').value)||0;
 const theme=document.getElementById('theme').checked?300:0;
 document.getElementById('appVal').textContent=apps;
 // paid platform monthly: plan + apps + theme amortized + 2.9% transaction
 const monthly=39 + apps*29 + theme/12 + orders*aov*0.029;
 const yearly=monthly*12 + theme;
 document.getElementById('month').textContent='$'+monthly.toFixed(0);
 document.getElementById('year').textContent='$'+yearly.toFixed(0);
}
['orders','aov','apps'].forEach(id=>document.getElementById(id).addEventListener('input',calc));
document.getElementById('theme').addEventListener('change',calc);
calc();
</script>
</body>
</html>
