<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shopify vs 100shop Cost Saver | 100shop</title>
<meta name="description" content="See how much you save with 100shop vs Shopify. Free store cost calculator — no monthly fees, keep your margin.">
<link rel="canonical" href="https://get100shop.com/">
<meta name="robots" content="index,follow">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif}
body{background:#f8fafc;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px}
.card{background:#fff;border-radius:18px;max-width:520px;width:100%;padding:26px;box-shadow:0 14px 40px rgba(15,23,42,.12);border:1px solid #e2e8f0}
.card h1{font-size:21px;color:#0f172a;margin-bottom:4px}
.card .sub{font-size:13px;color:#64748b;margin-bottom:18px}
label{display:block;font-size:12px;font-weight:600;color:#334155;margin:12px 0 4px}
input{width:100%;padding:11px 13px;border:1.5px solid #cbd5e1;border-radius:10px;font-size:15px}
input:focus{outline:none;border-color:#0ea5e9}
table{width:100%;border-collapse:collapse;margin-top:18px;font-size:14px}
th,td{padding:11px 10px;text-align:left;border-bottom:1px solid #e2e8f0}
th{font-size:12px;color:#64748b;font-weight:600;background:#f8fafc}
.you{color:#0ea5e9;font-weight:700}
.save{background:#ecfdf5;color:#059669;font-weight:800;border-radius:10px}
.cta{display:block;text-align:center;margin-top:18px;background:linear-gradient(90deg,#0ea5e9,#6366f1);color:#fff;font-weight:700;font-size:15px;padding:13px;border-radius:12px;text-decoration:none}
.cta:hover{opacity:.92}
.note{font-size:11px;color:#94a3b8;text-align:center;margin-top:10px}
</style>
</head>
<body>
<div class="card">
  <h1>Shopify vs 100shop — What You Save</h1>
  <p class="sub">Enter your monthly sales volume</p>
  <label>Orders per month</label>
  <input id="orders" type="number" value="200" min="0">
  <table>
    <tr><th>Cost</th><th>Shopify (Basic $39/mo)</th><th>100shop</th></tr>
    <tr><td>Monthly fee</td><td class="you">$39 + apps</td><td><b>$0</b></td></tr>
    <tr><td>Transaction / app fees</td><td class="you">~2.9% + apps</td><td><b>0%</b></td></tr>
    <tr><td>Total yearly cost</td><td id="shopify" class="you">—</td><td id="yours" class="you">$0</td></tr>
    <tr><td>Yearly savings</td><td colspan="2" class="save" id="save" style="text-align:center">—</td></tr>
  </table>
  <a class="cta" href="https://get100shop.com/">Start Free at 100shop →</a>
  <p class="note">Estimates only. 100shop has no monthly subscription.</p>
</div>
<script>
function calc(){
 const o=parseFloat(document.getElementById('orders').value)||0;
 // Shopify: $39/mo + ~2.9% on orders at ~$20 avg = $39*12 + o*12*20*0.029
 const shopifyYear=39*12 + o*12*20*0.029;
 document.getElementById('shopify').textContent='$'+shopifyYear.toFixed(0);
 document.getElementById('yours').textContent='$0';
 document.getElementById('save').textContent='You save ~$'+shopifyYear.toFixed(0)+' / yr';
}
document.getElementById('orders').addEventListener('input',calc);
calc();
</script>
</body>
</html>
