<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Try-On - Vintage Royal Lion Imperial Earrings</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Helvetica Neue', Arial, sans-serif; }
        body { background: #000; color: #fff; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
        header { position: absolute; top: 20px; z-index: 10; text-align: center; width: 100%; }
        header h1 { font-size: 1.4rem; color: #ffd32a; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
        header p { font-size: 0.8rem; color: #ccc; }
        
        #video-container { position: relative; width: 100%; max-width: 450px; height: 70vh; border-radius: 20px; overflow: hidden; border: 3px solid #ff4757; box-shadow: 0 0 20px #ff4757; }
        video { width: 100%; height: 100%; object-fit: cover; }
        
        /* 漂浮的 3D/2D 虚拟重叠耳环贴纸，支持手势拖拽缩放进行完美贴耳体验 */
        .earring-overlay {
            position: absolute;
            width: 85px;
            height: 85px;
            background: url('https://images.unsplash.com/photo-1630019852942-f89202989a59?q=80&w=200&auto=format&fit=crop') center/cover;
            border-radius: 50%;
            border: 2px solid #ffd32a;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            cursor: move;
            z-index: 20;
        }
        
        #earring-left { top: 40%; left: 20%; }
        #earring-right { top: 40%; right: 20%; }

        .controls { position: absolute; bottom: 25px; z-index: 10; width: 100%; display: flex; flex-direction: column; align-items: center; gap: 10px; }
        .cta-btn { background: linear-gradient(135deg, #e1b12c, #fbc531); color: #111; padding: 15px 35px; border-radius: 50px; text-decoration: none; font-weight: bold; font-size: 1.1rem; box-shadow: 0 8px 25px rgba(24bc, 197, 49, 0.4); text-transform: uppercase; border: none; cursor: pointer; animation: pulse 1.5s infinite; }
        
        /* 拦截弹窗 */
        #popup-trap { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 99; align-items: center; justify-content: center; padding: 20px; }
        .trap-card { background: #1c1c1c; border: 3px solid #ffd32a; border-radius: 20px; width: 100%; max-width: 400px; padding: 30px; text-align: center; }
        .trap-card h2 { font-size: 1.8rem; color: #ffd32a; margin-bottom: 15px; }
        .trap-card p { font-size: 1rem; color: #f5f6fa; margin-bottom: 25px; line-height: 1.5; }
        .trap-card .buy-now { display: inline-block; background: #ffd32a; color: #111; padding: 15px 35px; border-radius: 30px; font-weight: bold; text-decoration: none; font-size: 1.2rem; margin-bottom: 15px; width: 100%; box-shadow: 0 5px 15px rgba(251, 197, 49, 0.4); }
        .trap-card .close-btn { color: #aaa; text-decoration: underline; cursor: pointer; }

        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

    <header>
        <h1>👑 Vintage Royal Lion Try-On</h1>
        <p>Drag the imperial lion earrings to align perfectly with your ears!</p>
    </header>

    <div id="video-container">
        <!-- 调用原生网络摄像头流 -->
        <video id="webcam" autoplay playsinline></video>
        
        <!-- 虚拟可交互试戴贴片 -->
        <div id="earring-left" class="earring-overlay"></div>
        <div id="earring-right" class="earring-overlay"></div>
    </div>

    <div class="controls">
        <button class="cta-btn" onclick="triggerTrap()">📸 Snapshot & Save Look</button>
    </div>

    <!-- 磁铁拦截陷阱 -->
    <div id="popup-trap">
        <div class="trap-card">
            <h2>👑 LOOKING STUNNING! 👑</h2>
            <p>The Vintage Royal Lion Imperial design matches your aesthetic flawlessly. Take it home today with our exclusive seasonal rebate!</p>
            <a href="https://get100shop.com/products/lion-earrings" class="buy-now" target="_blank">CLAIM MY LOOK @ 50% OFF</a>
            <div class="close-btn" onclick="closeTrap()">Adjust try-on model</div>
        </div>
    </div>

    <script>
        const video = document.getElementById('webcam');

        // 启动前置摄像头
        if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
            navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } })
                .then(stream => {
                    video.srcObject = stream;
                })
                .catch(err => {
                    console.log("Webcam blocked, loading fallback interface.");
                });
        }

        // 实现极其灵敏、丝滑的手势与鼠标拖拽
        function makeDraggable(elm) {
            let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
            elm.onmousedown = dragMouseDown;
            elm.ontouchstart = dragMouseDown;

            function dragMouseDown(e) {
                e = e || window.event;
                if(e.type === 'touchstart') {
                    pos3 = e.touches[0].clientX;
                    pos4 = e.touches[0].clientY;
                } else {
                    pos3 = e.clientX;
                    pos4 = e.clientY;
                }
                document.onmouseup = closeDragElement;
                document.onmousemove = elementDrag;
                document.ontouchend = closeDragElement;
                document.ontouchmove = elementDrag;
            }

            function elementDrag(e) {
                e = e || window.event;
                let clientX = e.type === 'touchmove' ? e.touches[0].clientX : e.clientX;
                let clientY = e.type === 'touchmove' ? e.touches[0].clientY : e.clientY;
                
                pos1 = pos3 - clientX;
                pos2 = pos4 - clientY;
                pos3 = clientX;
                pos4 = clientY;
                elm.style.top = (elm.offsetTop - pos2) + "px";
                elm.style.left = (elm.offsetLeft - pos1) + "px";
            }

            function closeDragElement() {
                document.onmouseup = null;
                document.onmousemove = null;
                document.ontouchend = null;
                document.ontouchmove = null;
            }
        }

        makeDraggable(document.getElementById("earring-left"));
        makeDraggable(document.getElementById("earring-right"));

        function triggerTrap() {
            document.getElementById('popup-trap').style.display = 'flex';
        }
        function closeTrap() {
            document.getElementById('popup-trap').style.display = 'none';
        }
    </script>
</body>
</html>
